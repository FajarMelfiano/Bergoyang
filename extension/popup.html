<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <title>Request Lagu</title>
  <style>
    :root {
      --bg: #17121e; --panel: #1f1926; --line: #362c44;
      --amber: #f6a623; --red: #e0453c; --text: #f3ecdd; --dim: #a99cb8;
    }
    * { box-sizing: border-box; }
    body {
      width: 320px; margin: 0; padding: 14px;
      background: var(--bg); color: var(--text);
      font: 14px/1.45 "Segoe UI", system-ui, -apple-system, sans-serif;
    }
    h1 {
      margin: 0; font-size: 15px; letter-spacing: .14em; text-transform: uppercase;
      color: var(--amber); font-weight: 700;
    }
    .head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
    .conn { font-size: 11px; color: var(--dim); }
    .card {
      background: var(--panel); border: 1px solid var(--line);
      border-top: 3px solid var(--amber); border-radius: 6px;
      padding: 10px 12px; margin-bottom: 10px;
    }
    .label { font-size: 10px; letter-spacing: .12em; text-transform: uppercase; color: var(--dim); }
    .now-title { font-size: 15px; font-weight: 700; margin-top: 2px; overflow-wrap: anywhere; }
    .now-sub { font-size: 12px; color: var(--dim); margin-top: 2px; overflow-wrap: anywhere; }
    .player { font-size: 12px; margin-top: 8px; padding-top: 8px; border-top: 1px dashed var(--line); color: var(--dim); overflow-wrap: anywhere; }
    .player b { color: var(--text); }
    label { display: block; font-size: 11px; color: var(--dim); margin-bottom: 3px; }
    input {
      width: 100%; padding: 7px 9px; border-radius: 4px;
      border: 1px solid var(--line); background: #120e18; color: var(--text); font-size: 13px;
    }
    input:focus { outline: 1px solid var(--amber); }
    button {
      cursor: pointer; border: 0; border-radius: 4px; padding: 8px 12px;
      font-size: 13px; font-weight: 700; background: var(--amber); color: #17121e;
    }
    button.ghost { background: transparent; border: 1px solid var(--line); color: var(--text); font-weight: 600; }
    button.wide { width: 100%; }
    button:disabled { opacity: .55; cursor: default; }
    .btn-row { display: flex; gap: 8px; margin-top: 8px; }
    .note { font-size: 11.5px; color: var(--dim); margin-top: 8px; }
    .note.ok { color: #7bd39a; }
    .note.err { color: var(--red); }
    .hint { font-size: 11.5px; color: var(--dim); margin-top: 6px; }
    a { color: var(--amber); }
  </style>
</head>
<body>
  <div class="head">
    <h1>Request Lagu</h1>
    <span class="conn" id="conn">…</span>
  </div>

  <div class="card">
    <div class="label">Sedang diputar</div>
    <div class="now-title" id="nowTitle">—</div>
    <div class="now-sub" id="queueInfo">—</div>
    <div class="player" id="playerInfo">Player: —</div>
    <div class="btn-row">
      <button class="ghost" id="autoBtn" style="flex:1" disabled>Auto-play: …</button>
      <button class="ghost" id="openBtn" style="flex:1">Buka YT Music</button>
    </div>
  </div>

  <div class="card">
    <label for="code">Kode DJ</label>
    <input id="code" type="password" inputmode="numeric" placeholder="1234"
           style="margin-bottom:8px" />
    <button class="wide" id="saveBtn">Simpan</button>
    <div class="note" id="saveNote"></div>
    <p class="hint">
      Alamat server dibakukan di extension — <b>tidak perlu diisi</b>: otomatis
      memakai server daring (Vercel), dengan cadangan lokal
      <b>localhost:3000</b>. Sekali simpan, pemutar jalan otomatis. Tab YouTube
      Music harus terbuka (tombol "Buka YT Music"). Butuh internet.
    </p>
  </div>

  <script src="popup.js" defer></script>
</body>
</html>
